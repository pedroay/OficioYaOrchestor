spring:
  application:
    name: oficioya
  datasource:
    # Valores por defecto SOLO para desarrollo local (docker-compose.yml).
    # En cualquier otro ambiente se sobrescriben con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficioya}
    username: ${DB_USER:oficioya}
    password: ${DB_PASSWORD:oficioya}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
