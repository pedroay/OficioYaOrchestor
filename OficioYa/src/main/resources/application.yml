spring:
  application:
    name: oficioya

server:
  port: ${PORT:8081}

users:
  service:
    url: ${USERS_SERVICE_URL:http://localhost:8080}

identity:
  service:
    # Puerto provisional: se define al desplegar todos los servicios.
    url: ${IDENTITY_SERVICE_URL:http://localhost:8085}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    eci.edu.dosw: INFO

jwt:
  # Mismo secreto (Base64, minimo 32 bytes) que usan Identity y Users.
  # Sin valor por defecto: si falta JWT_SECRET la app no arranca (falla rapido).
  # En desarrollo local el secreto sale de application-local.yml.
  secret: ${JWT_SECRET}